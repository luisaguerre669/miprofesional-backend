<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MiProfesionalYa logo</title>
  <desc id="desc">Logo premium con monograma NMP en turquesa y dorado sobre fondo metálico.</desc>
  <defs>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0%" stop-color="#e7edf1"/>
      <stop offset="18%" stop-color="#b4bcc4"/>
      <stop offset="35%" stop-color="#808891"/>
      <stop offset="52%" stop-color="#dfe4e9"/>
      <stop offset="68%" stop-color="#6d767d"/>
      <stop offset="100%" stop-color="#caccd0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#33d0e1"/>
      <stop offset="35%" stop-color="#119bb8"/>
      <stop offset="70%" stop-color="#0e7587"/>
      <stop offset="100%" stop-color="#0c4f62"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#f4d98a"/>
      <stop offset="50%" stop-color="#d3af4c"/>
      <stop offset="100%" stop-color="#b7892e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#022a33" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="250" y="156" width="700" height="420" rx="20" fill="url(#metal)" stroke="#f3f5f8" stroke-opacity="0.35" stroke-width="6"/>
  </g>

  <g opacity="0.18">
    <path d="M300 540 L900 540" stroke="#ffffff" stroke-width="6"/>
    <path d="M280 220 L920 220" stroke="#ffffff" stroke-width="6"/>
  </g>

  <g>
    <text x="382" y="470" font-size="360" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="url(#teal)" letter-spacing="-20" transform="skewX(-6)">N</text>
    <text x="552" y="470" font-size="360" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="url(#teal)" letter-spacing="-20" transform="skewX(-6)">M</text>
    <text x="760" y="470" font-size="360" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="url(#teal)" letter-spacing="-20" transform="skewX(-6)">P</text>

    <path d="M 490 352 C 575 430, 635 440, 698 430 C 748 422, 785 390, 812 340" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 498 522 C 560 440, 620 440, 695 470 C 760 497, 758 500, 820 456" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
  </g>

  <g>
    <text x="456" y="740" font-size="146" font-weight="700" font-family="'Brush Script MT', 'Segoe Print', cursive" fill="url(#gold)" letter-spacing="1">MiProfesionalYa</text>
  </g>
</svg>
